<div class="app-container">
    <header class="app-header">
        <h1>📝 Todo App</h1>
    </header>

    <main class="app-main">
        <app-add-todo
            [submitting]="isAdding"
            (addTodo)="onAddTodo($event)"
        ></app-add-todo>

        <div *ngIf="errorMessage" class="error-banner" role="alert">
            {{ errorMessage }}
            <button
                class="btn-dismiss"
                (click)="dismissError()"
                aria-label="Dismiss error"
            >
                ✕
            </button>
        </div>

        <div class="sort-bar" *ngIf="todos.length > 1">
            <button
                *ngIf="sortStale"
                type="button"
                class="btn-resort"
                (click)="resort()"
                [disabled]="isLoading"
            >
                Order is out of date — re-sort
            </button>

            <label class="sort-label" for="sort-select">Sort by</label>
            <select
                id="sort-select"
                name="sort"
                class="sort-select"
                [ngModel]="sortBy"
                (ngModelChange)="onSortChange($event)"
                [disabled]="isLoading"
            >
                <option *ngFor="let option of sortOptions" [value]="option.value">
                    {{ option.label }}
                </option>
            </select>
        </div>

        <div *ngIf="isFirstLoad" class="loading" role="status">Loading…</div>

        <app-todo-list
            *ngIf="!isFirstLoad"
            [class.refreshing]="isLoading"
            [todos]="todos"
            [pendingIds]="pendingIds"
            (toggleComplete)="onToggleComplete($event)"
            (deleteTodo)="onDeleteTodo($event)"
        >
        </app-todo-list>
    </main>
</div>
