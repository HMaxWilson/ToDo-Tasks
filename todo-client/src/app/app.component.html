<div class="app-container">
    <header class="app-header">
        <h1>📝 Todo App</h1>
    </header>

    <main class="app-main">
        <app-add-todo
            [submitting]="isAdding"
            (addTodo)="onAddTodo($event)"
        ></app-add-todo>

        <div *ngIf="errorMessage" class="error-banner" role="alert">
            {{ errorMessage }}
            <button
                class="btn-dismiss"
                (click)="dismissError()"
                aria-label="Dismiss error"
            >
                ✕
            </button>
        </div>

        <div *ngIf="isFirstLoad" class="loading" role="status">Loading…</div>

        <app-todo-list
            *ngIf="!isFirstLoad"
            [class.refreshing]="isLoading"
            [todos]="todos"
            [pendingIds]="pendingIds"
            (toggleComplete)="onToggleComplete($event)"
            (deleteTodo)="onDeleteTodo($event)"
        >
        </app-todo-list>
    </main>
</div>
