<div class="todo-list">
    <p class="todo-summary" *ngIf="todos.length > 0">
        {{ pendingCount() }} of {{ todos.length }} remaining
    </p>

    <p class="todo-empty" *ngIf="todos.length === 0">
        No todos yet — add one above!
    </p>

    <p class="reorder-hint" *ngIf="todos.length > 1 && !canReorder">
        Switch to the default order to drag items around.
    </p>

    <div
        class="todo-drop-list"
        cdkDropList
        [cdkDropListDisabled]="!canReorder"
        (cdkDropListDropped)="onDrop($event)"
    >
        <app-todo-item
            *ngFor="let todo of todos; trackBy: trackById"
            cdkDrag
            cdkDragBoundary=".todo-drop-list"
            [cdkDragDisabled]="!canReorder || isPending(todo.id)"
            [todo]="todo"
            [pending]="isPending(todo.id)"
            [draggable]="canReorder"
            (toggleComplete)="onToggle($event)"
            (deleteTodo)="onDelete($event)"
        >
        </app-todo-item>
    </div>
</div>
